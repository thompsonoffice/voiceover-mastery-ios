# XcodeGen spec for VoiceOver Mastery. CI runs `xcodegen generate`.
# Locally: brew install xcodegen && xcodegen generate
name: VoiceOverMastery
options:
  bundleIdPrefix: com.thompsonoffice
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  VoiceOverMastery:
    type: application
    platform: iOS
    sources:
      - path: VoiceOverMastery
    settings:
      base:
        PRODUCT_NAME: VoiceOverMastery
        PRODUCT_BUNDLE_IDENTIFIER: com.thompsonoffice.voiceovermastery
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Screen Reader Mastery"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
  VoiceOverMasteryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VoiceOverMasteryTests
    dependencies:
      - target: VoiceOverMastery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thompsonoffice.voiceovermastery.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VoiceOverMastery.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/VoiceOverMastery"
        BUNDLE_LOADER: "$(TEST_HOST)"
  VoiceOverMasteryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VoiceOverMasteryUITests
    dependencies:
      - target: VoiceOverMastery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thompsonoffice.voiceovermastery.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VoiceOverMastery
schemes:
  VoiceOverMastery:
    build:
      targets:
        VoiceOverMastery: all
        VoiceOverMasteryTests: [test]
        VoiceOverMasteryUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - VoiceOverMasteryTests
        - VoiceOverMasteryUITests
    archive:
      config: Release
