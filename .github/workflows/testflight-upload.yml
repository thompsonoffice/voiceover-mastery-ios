# Archives, signs and uploads Screen Reader Mastery (VoiceOverMastery target) to App Store Connect (TestFlight).
#
# It cannot run until ALL of these are true (see docs/APP-STORE-SETUP.md):
#   1. The Apple Developer Program membership is active (no longer "pending").
#   2. An app record for bundle ID com.thompsonoffice.voiceovermastery exists in App Store Connect.
#   3. Repository secrets exist: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8 file's text),
#      APPLE_TEAM_ID.
#   4. Repository variable ENABLE_TESTFLIGHT_UPLOAD is set to true.
# Until then the job is skipped even if someone starts the workflow by hand.
name: TestFlight upload (disabled)

on:
  workflow_dispatch:

jobs:
  upload:
    if: ${{ vars.ENABLE_TESTFLIGHT_UPLOAD == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Use the newest installed Xcode
        run: |
          shopt -s nullglob
          candidates=(/Applications/Xcode_*.app)
          if [ ${#candidates[@]} -eq 0 ]; then
            XCODE=/Applications/Xcode.app
          else
            XCODE=$(printf '%s\n' "${candidates[@]}" | sort -V | tail -1)
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive (cloud-managed signing through the API key)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project VoiceOverMastery.xcodeproj -scheme VoiceOverMastery -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/VoiceOverMastery.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="1" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | xcbeautify

      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed "s/TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/" scripts/ExportOptions-upload.plist > build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/VoiceOverMastery.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the key file
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
